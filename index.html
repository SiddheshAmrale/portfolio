    <!-- Hide scroll-reveal content only when JS is running; if the bundle has not
         hydrated after 4 s, show everything rather than leave the page blank. -->
    <script>
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!document.documentElement.classList.contains('hydrated')) document.documentElement.classList.remove('js');
      }, 4000);
    </script>
