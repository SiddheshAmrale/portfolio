name: Systems workbench

on:
  push:
  pull_request:

jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run workbench:test
      - run: npm run workbench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-reports
          path: reports/
