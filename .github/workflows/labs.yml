name: labs

on:
  push:
    paths:
      - 'forge/**'
      - 'link/**'
      - 'smr/**'
      - 'pilot/**'
      - 'src/labs/**'
      - 'public/learn/**'
      - '.github/workflows/labs.yml'
  pull_request:
    paths:
      - 'forge/**'
      - 'link/**'
      - 'smr/**'
      - 'pilot/**'
      - 'src/labs/**'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install -e "./pilot[dev]" -e "./forge[dev]" -e "./link[dev]" -e "./smr[dev]"
      - name: Fixture tests
        run: python -m pytest -q forge/tests link/tests smr/tests pilot/tests
      - name: Build static cases
        run: |
          python -m forge build-cases --out public/forge
          python -m link build-cases --out public/link
          python -m smr build-cases --out public/smr
      - name: Validate learn JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('public/learn')
          required = [
            'curriculum.json', 'research.json', 'scorecard.json',
            'interview-scripts.json', 'glossary.json', 'near-misses.json',
            'practice-path.json',
          ]
          for name in required:
              p = root / name
              assert p.exists(), name
              json.loads(p.read_text(encoding='utf-8'))
          cur = json.loads((root / 'curriculum.json').read_text(encoding='utf-8'))
          assert len(cur['tracks']) >= 5
          assert sum(len(t['lessons']) for t in cur['tracks']) >= 20
          print('learn json ok', len(cur['tracks']), 'tracks')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lab-cases
          path: |
            public/forge/
            public/link/
            public/smr/
            public/learn/
